version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Temporary. TypeScript 7 ships no programmatic JS API until 7.1, so
      # typescript-eslint crashes on import under it (typescript-eslint#10940)
      # and a major bump can never go green here. typecheck already runs on
      # TypeScript 7 via the `typescript-7` alias. Remove this once
      # typescript-eslint publishes a peer range covering typescript@7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      next-and-react:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react*"
      supabase:
        patterns:
          - "@supabase/*"
      ui:
        patterns:
          - "@radix-ui/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-*"
          - "lucide-react"
          - "@tabler/*"
          - "class-variance-authority"
          - "clsx"
      tooling:
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript"
          - "@types/*"
          - "turbo"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
